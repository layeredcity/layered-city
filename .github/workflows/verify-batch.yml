# Verifies a new-city batch (read-only). Runs when data/batch/run changes.
name: Verify batch
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [data/batch/run]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/verify-batch.mjs
        env:
          TOURS_ONLY: ${{ contains(github.event.head_commit.message, 'tours only') && '1' || '0' }}
      - run: |
          git add data/batch/check.json
          git diff --cached --quiet && exit 0
          git config user.name "Layered City verify"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify batch"
          git pull --rebase origin main
          git push origin HEAD:main
