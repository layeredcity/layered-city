# Finds and fills missing book and album covers. See scripts/cover-pass.mjs.
name: Cover pass
on:
  push:
    branches: [main]
    paths: [data/cover-pass/run]
permissions:
  contents: write
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/cover-pass.mjs
        env:
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      - if: always()
        run: |
          git add data/cover-pass || true
          git diff --cached --quiet && exit 0
          git config user.name "Layered City cover pass"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cover pass results"
          git pull --rebase origin main
          git push origin HEAD:main
