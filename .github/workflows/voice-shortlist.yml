# Shortlists ElevenLabs voice-library voices for each city's Words audio and
# commits voices/shortlist.json. Needs the ELEVENLABS_API_KEY repository secret;
# without it the job skips quietly. See scripts/voice-shortlist.mjs.
name: Voice shortlist

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/voice-shortlist.mjs
      - .github/workflows/voice-shortlist.yml
      - voices/run-shortlist   # touch this file to re-run

permissions:
  contents: write

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shortlist
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::notice::ELEVENLABS_API_KEY secret not set yet; skipping"; exit 0; fi
          node scripts/voice-shortlist.mjs
      - name: Commit
        run: |
          [ -f voices/shortlist.json ] || exit 0
          git add voices/shortlist.json voices/debug-*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Layered City voice shortlist"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update voice shortlist"
          git pull --rebase origin main
          git push origin HEAD:main
