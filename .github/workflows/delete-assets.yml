# Deletes specific Contentful assets listed in data/migrate/run-delete-assets.
# See scripts/delete-assets.mjs.
name: Delete assets
on:
  push:
    branches: [main]
    paths: [data/migrate/run-delete-assets]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/delete-assets.mjs
        env:
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      - if: always()
        run: |
          git add data/migrate/delete-assets-log.json || true
          git diff --cached --quiet && exit 0
          git config user.name "Layered City cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Delete-assets log"
          git pull --rebase origin main
          git push origin HEAD:main
