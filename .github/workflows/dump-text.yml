# Read-only dump of Words/Food text for copy-editing. Runs when data/run-dump-text changes.
name: Dump text
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [data/run-dump-text]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/dump-text.mjs
        env:
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN || 'gtCMYzILHdhtTGIE-BjXN2vksuSjR2LeJonHQo51xS0' }}
      - run: |
          git add data/text
          git diff --cached --quiet && exit 0
          git config user.name "Layered City text"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dump text"
          git pull --rebase origin main
          git push origin HEAD:main
