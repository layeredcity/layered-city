# YouTube search lists for research (read-only). Runs when data/run-yt-search changes.
name: YouTube search
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [data/run-yt-search]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -q yt-dlp
      - run: node scripts/yt-search.mjs
      - run: |
          git add data/ytsearch
          git diff --cached --quiet && exit 0
          git config user.name "Layered City research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "YouTube search results"
          git pull --rebase origin main
          git push origin HEAD:main
